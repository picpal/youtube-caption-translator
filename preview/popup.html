<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>[Preview] Popup — YouTube Play Assistant</title>
    <style>
      /* Harness-only framing so the popup reviews at its real ~360px MV3
         popup width instead of stretching across the browser tab.
         entrypoints/popup/App.tsx already sets w-[360px] on its own root
         div; this just gives that box a visible viewport boundary (border +
         shadow) and centers it on the page. Production code is untouched.

         Coexists with preview/dev-panel.ts's `html.dark body` /
         `html:not(.dark) body` !important background overrides: those still
         own the page backdrop color; this only adds a border/shadow around
         #root, so there is nothing to fight over. */
      html,
      body {
        margin: 0;
      }
      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 40px 24px;
        box-sizing: border-box;
      }
      .ypa-frame {
        width: 360px;
        box-sizing: border-box;
        border-radius: 8px;
        border: 1px solid rgba(115, 115, 115, 0.35);
        box-shadow:
          0 16px 40px rgba(0, 0, 0, 0.18),
          0 2px 6px rgba(0, 0, 0, 0.1);
        overflow: hidden;
      }
      html.dark .ypa-frame {
        border-color: rgba(255, 255, 255, 0.14);
        box-shadow:
          0 16px 40px rgba(0, 0, 0, 0.6),
          0 2px 6px rgba(0, 0, 0, 0.4);
      }
    </style>
  </head>
  <body>
    <div class="ypa-frame">
      <div id="root"></div>
    </div>
    <script type="module" src="./popup-entry.ts"></script>
  </body>
</html>
